    - {name: AREA_MEDIAN_YEAR_FILL, value: "a building with no year (no OSM start_date, no NSI match) takes the ACS 2022 5-year B25035 median year structure built of its census block group, else tract, else county; sources.year_built = acs:b25035_2022:<level>, year_built_area = GEOID", source: "U.S. Census Bureau ACS 2022 5-year summary file acsdt5y2022-b25035.dat (sha256 c22282ef...), TIGER/Line 2022 block groups tl_2022_56_bg.zip (642670e7...) and tl_2022_30_bg.zip (6cbe24b8...)", basis: "flow's only year source besides a few OSM tags is NSI med_yr_blt, itself the median year built of the census block (NSI field definition), not the building's year: Teton's 9,997 NSI years take 16 distinct values and 94% equal their ~500 m neighbourhood's; the area median is the same statistic from its source, labelled as such. NSI vs ACS block-group median: median difference -2 years, within 10 years for 97% (Teton). A classifier year head only relearns the neighbourhood median from coordinates (OOF decision agreement 99.5%, a leak, not skill). Owner 2026-10-03: year built should be filled", where: "classifier acs_year.AreaYear; fill_metadata.apply_year_fill (enrichment step); extract._feature_value reads it as unknown", note: "Teton 7,242 buildings filled (all at block-group level); ASU excluded (per-building campus validation, an area housing median says nothing about a campus building)", oracle: test_year_fill::test_fill_only_blank_years_and_stamp_the_area, status: ASSUMPTION}
