# dev environment to namespace powertwin-dev
global:
  branch: dev
  imageTag: dev

networkPolicy:
  ingressControllerNamespace: ingress-nginx

ingress:
  className: nginx
  tls:
    clusterIssuer: letsencrypt-dns01
  flask:
    host: dev-solver.powertwin.io
  mss:
    host: dev-solver-mss.powertwin.io

secrets:
  pgAdminToken: ""
  apiSolverToken: ""
  slackVerificationToken: ""
  slackSigningSecret: ""
  slackWebhookUrl: ""

pg:
  persistence:
    size: 20Gi

pgbouncer:
  image:
    tag: ""
  replicas: 1
  pdb:
    enabled: false

flask:
  image:
    tag: ""
  replicas: 1
  hpa:
    enabled: false
  resources:
    requests:
      cpu: "0.5"
      # request = limit (owner 2026-10-20): dev runs 1 job (powertwin-db API_SOLVER_CONCURRENCY_LIMIT=1, 46d12ff), so one
      # sim (about 1.4 GB) plus a fast-estimate batch (about 1.6 GB) fits 3Gi, and Karpenter sizes the pool from it
      memory: 3Gi
    limits:
      # Re-measured 2026-09-14 by running real concurrent sandbox sims: a single sim peaks near
      # 1Gi but concurrency costs more per sim, 3 together peak at 4235Mi, so the old 3Gi ceiling
      # would OOM at the configured 3. Dev shares one 8Gi solver node with main (both carry
      # nodeSelector workload=solver and only one node is labelled); since 2026-10-20 dev runs 1 job at
      # 3Gi request = limit and Karpenter adds solver capacity from the requests.
      cpu: "2"
      memory: 3Gi
  nodeSelector:
    workload: solver
  tolerations:
    - key: workload
      operator: Equal
      value: solver
      effect: NoSchedule

mss:
  image:
    tag: ""
  replicas: 1
