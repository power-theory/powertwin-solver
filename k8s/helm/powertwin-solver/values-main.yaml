# main (production) environment to namespace powertwin-main
global:
  branch: main
  imageTag: main

ingress:
  flask:
    host: solver.powertwin.io
  mss:
    host: solver-mss.powertwin.io

secrets:
  # Production secrets MUST be injected by CI / sealed-secrets, not committed here.
  pgAdminToken: ""
  apiSolverToken: ""
  slackVerificationToken: ""
  slackSigningSecret: ""
  slackWebhookUrl: ""

pg:
  persistence:
    # Solver deletes sim files after each run, so this DB stays small (15Gi).
    size: 15Gi
  resources:
    requests:
      cpu: "0.1"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

pgbouncer:
  image:
    tag: ""
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: "0.01"
      memory: 16Mi
    limits:
      cpu: "0.05"
      memory: 64Mi

flask:
  image:
    tag: ""
  replicas: 1
  nodeSelector:
    workload: solver
  tolerations:
    - key: workload
      operator: Equal
      value: solver
      effect: NoSchedule
  resources:
    requests:
      cpu: "1"
      # request = limit (owner 2026-10-20): Karpenter sizes the solver pool from requests, so an honest request gets
      # main a node with room for its 3 concurrent sims (peak about 4.2 GB) and makes it the last eviction pick
      memory: 6Gi
    limits:
      # Measured on dev 2026-09-14 with the same image: 3 concurrent sims peak at 4235Mi and
      # 4 concurrent at 5803Mi, so a 4Gi ceiling OOMs even at 3. Throughput is flat between 3
      # and 4 (both ~60 sims/hour, the 4th just contends), so the listener runs at 3 and this
      # is sized for that peak plus headroom. Live had already drifted to 4 cpu / 5Gi.
      cpu: "4"
      memory: 6Gi
  terminationGracePeriodSeconds: 14400
  # KEDA queue-based scaling for prod (scales 0..1 on queued sims, true scale-to-
  keda:
    enabled: true
    # one replica stays up, so a run never waits on a cold start (KEDA's 30 s poll, the boot, the listener's
    # hold): it shares the solver node dev's always-on solver keeps up, so idle it costs next to nothing
    minReplicaCount: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 1  # capped at 1: parallelism is N sims inside ONE pod (listener concurrency, verified 4-way on dev 2026-09-14), so extra flask pods add no throughput and break the async protocol -- flask keeps sim state on pod-local emptyDir and the Service has no session affinity, so status/results polls round-robin to pods without the data (404) and jobs jam behind the single slot. Raise only alongside shared /solver/data + a higher listener concurrency.
    targetCPUUtilization: 80
  urbanopt:
    simulationYear: "2026"
    reportingFrequency: "Hourly"

mss:
  image:
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: "0.01"
      memory: 64Mi
    limits:
      cpu: "0.05"
      memory: 128Mi
