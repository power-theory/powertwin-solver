# Single source for pytest collection settings (previously none existed anywhere: markers were
# registered only programmatically in tests/conftest.py, and tests/runs//tests/tools were only
# skipped by naming convention). Q/A campaign WP-01.
[pytest]
markers =
    requires_container: needs the OpenStudio/`uo` runtime; runs only inside the run_docker.sh container, skipped on the host.
norecursedirs = tests/runs tests/tools tests/data .git venv
addopts = -ra
