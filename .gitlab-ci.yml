# PowerTwin Solver - GitLab CI/CD Pipeline
# dev branch -> test + build + deploy to dev (staging)
# main branch -> test + build + deploy to main + demo -> mirror
#
# Required CI/CD variables:
#   AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (AWS_ACCOUNT_ID is derived)
#   GITHUB_PUSH_TOKEN (PAT with repo scope for GitHub mirror)
#   PG_DB_TOKEN_ADMIN, API_SOLVER_TOKEN, PG_DB_PASSWORD (main app PG password, for KEDA)
#   MSS_SLACK_VERIFICATION_TOKEN, MSS_SLACK_SIGNING_SECRET, MSS_SLACK_WEBHOOK_URL

stages:
  - test
  - build
  - deploy
  - mirror

variables:
  AWS_REGION: ${AWS_REGION}
  DOMAIN_NAME: ${DOMAIN_NAME}
  IMAGE_TAG: ${CI_COMMIT_BRANCH}-${CI_COMMIT_SHORT_SHA}
  HELM_CHART: k8s/helm/${CI_PROJECT_NAME}
  HELM_RELEASE: ${CI_PROJECT_NAME}
  K8S_NAMESPACE: powertwin-${CI_COMMIT_BRANCH}

# Test

test_resolvers:
  stage: test
  image: python:3.10-slim
  tags:
    - k8s
  script:
    # mpi4py (in solver/requirements) has no slim-image wheel; build it against a real MPI toolchain
    - apt-get update && apt-get install -y --no-install-recommends gcc libopenmpi-dev
    # pyyaml is for the deploy config contract tests, which read .gitlab-ci.yml and the compose files
    - pip install -r solver/requirements.txt pytest pyyaml --quiet
    # Install the app package too, so the test env matches the container (Dockerfile
    # runs `pip install -e ./app`): its setup.py is the single source of truth for
    # app-level deps like requests, which modules.utils imports at collection time.
    - pip install -e solver/app --quiet
    # The county reference tables are Git LFS objects (2026-09-30; they came from a package registry before).
    # Their checksums are pinned in county_tables.sha256, and a checkout that left LFS pointers fails here.
    - (cd solver/upload/reference_data && sha256sum -c --quiet county_tables.sha256)
    # tests/data/gen_leaf_stock.py templates its geometries from the LFS-tracked ASU
    # demo file; a checkout that left the LFS pointer in place would fail deep inside
    # json.load, so say so here instead.
    - if grep -q "git-lfs.github.com/spec" solver/upload/demo_data/asu_asset_geometries.geojson; then echo "solver/upload/demo_data is an unhydrated Git LFS pointer; the runner checkout did not fetch LFS objects"; exit 1; fi
    - python -m pytest tests/ -m "not requires_container" -q
  # Hand the verified tables to the build jobs (needs: implies artifacts), so the docker COPY ships them even if
  # a build job's checkout skipped LFS; build_flask and the Dockerfile re-verify the checksums.
  artifacts:
    paths:
      - solver/upload/reference_data/*.json.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|main)$/

# Build

.ecr_login: &ecr_login
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  - export ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  - aws ecr get-login-password --region ${AWS_REGION}
      | docker login --username AWS --password-stdin ${ECR_REGISTRY}

.build_template:
  stage: build
  needs: [test_resolvers]
  image: docker:26.1.4
  tags:
    - k8s
  before_script:
    # -u expat: docker:26.1.4 ships an expat too old for aws-cli's pyexpat (relocation crash)
    - apk add --no-cache -u aws-cli expat
    - *ecr_login
  after_script:
    # The daemon is the shared runner host's, so every per-commit image a job pushed stayed
    # behind until someone pruned by hand. Drop only THIS job's per-commit tag (IMAGE_NAME is
    # set per job; the three build jobs run concurrently on one daemon, and a pattern over
    # sibling names untagged flask's image mid-push), never the branch tag, which the next
    # build retags (a concurrent same-branch pipeline may still be pushing it). after_script
    # runs in its own shell, so ECR_REGISTRY from before_script is not available: match the
    # registry part loosely and the name and tag exactly. The buildkit cache keeps the layers;
    # prune dangling images and bound the cache instead of emptying it after every job; the
    # keep-storage prune skips records another job is using.
    - docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E "^[^/]+/${CI_PROJECT_NAME}-${IMAGE_NAME}:${IMAGE_TAG}$" | xargs -r docker image rm -f || true
    - docker image prune -f
    - docker builder prune -f --keep-storage 20G
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|main)$/

build_flask:
  extends: .build_template
  variables:
    IMAGE_NAME: flask
  script:
    # Refuse to build an image without the county tables (the resolver would silently
    # fall back to division-level priors while still stamping the county resolver version).
    - (cd solver/upload/reference_data && sha256sum -c county_tables.sha256)
    - docker build -t ${ECR_REGISTRY}/${CI_PROJECT_NAME}-flask:${IMAGE_TAG} --build-arg GIT_SHA=${CI_COMMIT_SHA}
        -t ${ECR_REGISTRY}/${CI_PROJECT_NAME}-flask:${CI_COMMIT_BRANCH}
        -f ./solver/Dockerfile ./solver
    - docker push ${ECR_REGISTRY}/${CI_PROJECT_NAME}-flask --all-tags

build_pgbouncer:
  extends: .build_template
  variables:
    IMAGE_NAME: pgbouncer
  script:
    - docker build -t ${ECR_REGISTRY}/${CI_PROJECT_NAME}-pgbouncer:${IMAGE_TAG}
        -t ${ECR_REGISTRY}/${CI_PROJECT_NAME}-pgbouncer:${CI_COMMIT_BRANCH}
        ./pgbouncer
    - docker push ${ECR_REGISTRY}/${CI_PROJECT_NAME}-pgbouncer --all-tags

build_mss:
  extends: .build_template
  variables:
    IMAGE_NAME: mss
  script:
    - docker build -t ${ECR_REGISTRY}/${CI_PROJECT_NAME}-mss:${IMAGE_TAG}
        -t ${ECR_REGISTRY}/${CI_PROJECT_NAME}-mss:${CI_COMMIT_BRANCH}
        ./mss
    - docker push ${ECR_REGISTRY}/${CI_PROJECT_NAME}-mss --all-tags

# NOTE: the surrogate + classifier modeling images are NOT built here. They run on HPC
# (Medicine Bow), not the k8s cluster, so they are not in the helm chart and nothing consumes
# an ECR -surrogate/-classifier image. Like the solver image on HPC, they are pushed to Docker
# Hub manually when needed (docker build ./surrogate | ./classifier -> docker push). Re-add a
# build job here only if a Docker Hub (not ECR) push target and an HPC consumer are wired up.

# Deploy

.deploy_template:
  stage: deploy
  image:
    name: alpine/helm:3.21.2
    entrypoint: [""]   # override helm entrypoint so the shell script runs
  tags:
    - k8s
  before_script:
    - apk add --no-cache aws-cli kubectl jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - export CLUSTER_NAME=${CLUSTER_NAME:-powertwin}
    - aws eks update-kubeconfig --name ${CLUSTER_NAME} --region ${AWS_REGION}
    - |
      jq -n \
        --arg pgAdminToken "${PG_DB_TOKEN_ADMIN}" \
        --arg apiSolverToken "${API_SOLVER_TOKEN}" \
        --arg slackVerificationToken "${MSS_SLACK_VERIFICATION_TOKEN:-}" \
        --arg slackSigningSecret "${MSS_SLACK_SIGNING_SECRET:-}" \
        --arg slackWebhookUrl "${MSS_SLACK_WEBHOOK_URL:-}" \
        --arg mainPgPassword "${PG_DB_PASSWORD:-}" \
        '{secrets: {
          pgAdminToken: $pgAdminToken,
          apiSolverToken: $apiSolverToken,
          slackVerificationToken: $slackVerificationToken,
          slackSigningSecret: $slackSigningSecret,
          slackWebhookUrl: $slackWebhookUrl,
          mainPgPassword: $mainPgPassword
        }}' > /tmp/secrets.json
    # URBANOPT runtime config is sourced from GitLab CI vars (single source of truth) so
    # changing year/resample/etc needs no chart change and cannot get stranded again.
    - export URBANOPT_SETS="--set-string flask.urbanopt.simulationYear=${URBANOPT_SIMULATION_YEAR:-2026} --set-string flask.urbanopt.reportingFrequency=${URBANOPT_REPORTING_FREQUENCY:-Timestep} --set-string flask.urbanopt.resample=${URBANOPT_RESAMPLE:-} --set-string flask.urbanopt.dynamicDefaults=${URBANOPT_DYNAMIC_DEFAULTS:-false} --set-string flask.urbanopt.postprocessTranslations=${URBANOPT_POSTPROCESS_TRANSLATIONS:-false} --set-string flask.urbanopt.stochasticSampling=${URBANOPT_STOCHASTIC_SAMPLING:-false} --set-string flask.urbanopt.keepRunDir=${URBANOPT_KEEP_RUN_DIR:-false} --set-string flask.urbanopt.runTimeoutS=${URBANOPT_RUN_TIMEOUT_S:-129600}"

deploy_dev:
  extends: .deploy_template
  script:
    - helm upgrade --install ${HELM_RELEASE} ${HELM_CHART}
        --namespace ${K8S_NAMESPACE}
        --create-namespace
        -f ${HELM_CHART}/values-${CI_COMMIT_BRANCH}.yaml
        -f /tmp/secrets.json
        --set global.imageRegistry=${ECR_REGISTRY}
        --set global.imageTag=${IMAGE_TAG}
        --set global.branch=${CI_COMMIT_BRANCH}
        ${URBANOPT_SETS}
        --atomic
        --wait
        --timeout 10m
  environment:
    name: ${K8S_NAMESPACE}
    url: https://dev-solver.${DOMAIN_NAME}
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_main:
  extends: .deploy_template
  script:
    - helm upgrade --install ${HELM_RELEASE} ${HELM_CHART}
        --namespace ${K8S_NAMESPACE}
        --create-namespace
        -f ${HELM_CHART}/values-${CI_COMMIT_BRANCH}.yaml
        -f /tmp/secrets.json
        --set global.imageRegistry=${ECR_REGISTRY}
        --set global.imageTag=${IMAGE_TAG}
        --set global.branch=${CI_COMMIT_BRANCH}
        ${URBANOPT_SETS}
        --atomic
        --wait
        --timeout 10m
  environment:
    name: ${K8S_NAMESPACE}
    url: https://solver.${DOMAIN_NAME}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

